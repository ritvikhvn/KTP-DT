<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTP-DT Architecture Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
  /* clean theme tokens (light / dark), Archify palette */
  :root { --fg:#1b2b34; --bg:#f6f8fa; --muted:#56707c; --border:#d0dbe1; --accent:#087f9c;
          --panel:#ffffff; --canvas:#ffffff; --dot:#e6edf1; --hl:#b65120; --bad:#b32f50;
          --wire:#6d93a5; --wire-em:#087f69; --wire-dash:#6757a8; --frame:#a86609;
          --frame-fill:none; --mask:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --bg:#0d1117; --muted:#9aa9b4; --border:#2b3640; --accent:#66d9ef;
            --panel:#131a21; --canvas:#131a21; --dot:#1f2830; --hl:#ffad66; --bad:#ff8da1;
            --wire:#78a3b7; --wire-em:#64dfc1; --wire-dash:#b4a8ff; --frame:#ffd166;
            --frame-fill:none; --mask:#131a21; }
  }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--fg);
         background:var(--bg); margin:0; line-height:1.5; font-size:14px; }
  header { padding:12px 20px 8px; border-bottom:1px solid var(--border); background:var(--panel); }
  h1 { font-size:22px; font-weight:700; margin:0 0 2px; }
  .meta { color:var(--muted); font-size:12px; }
  .meta code { font-size:11px; }
  code { font-family:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,monospace; background:var(--panel);
         padding:0 4px; border-radius:4px; font-size:12px; }
  #banner { display:none; background:var(--bad); color:#fff; padding:8px 20px; font-size:13px; white-space:pre-wrap; }
  nav.tabs { display:flex; gap:4px; padding:8px 20px 0; border-bottom:1px solid var(--border); background:var(--panel); }
  nav.tabs button { background:none; border:1px solid transparent; border-bottom:none; padding:6px 14px; cursor:pointer;
         color:var(--muted); font:inherit; border-radius:6px 6px 0 0; }
  nav.tabs button.on { color:var(--fg); border-color:var(--border); background:var(--bg); margin-bottom:-1px; font-weight:600; }
  .view { display:none; } .view.on { display:block; }
  #crumbs { padding:8px 20px; font-size:13px; display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  #crumbs a { color:var(--accent); text-decoration:none; cursor:pointer; } #crumbs a:hover { text-decoration:underline; }
  #crumbs .sep { color:var(--muted); }
  #crumbs .up { margin-left:auto; }
  .wrap { display:grid; grid-template-columns: minmax(0,1fr) 330px; gap:0; border-top:1px solid var(--border);
          height:calc(100vh - 150px); min-height:480px; position:relative; }
  #canvas { overflow:auto; background-color:var(--canvas); padding:24px; }
  #canvas svg { display:block; margin:0 auto; }
  #canvas svg text { font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--fg); text-anchor:middle; pointer-events:none; }
  #canvas .node { cursor:pointer; }
  #canvas .node rect { stroke-width:1.5px; }
  #canvas .node.sub rect { stroke-width:2.6px; }
  #canvas .node.port rect { stroke-width:1.5px; stroke-dasharray:none; }
  #canvas .node:hover rect { filter:brightness(1.06); stroke:var(--accent) !important; }
  #canvas .nm { font-size:12px; font-weight:600; }
  #canvas .ns { font-size:10px; fill:var(--muted); }
  #canvas .frame rect.fr { fill:var(--frame-fill); stroke:var(--frame); stroke-width:1px; stroke-dasharray:8 4; }
  #canvas .frame rect.fm { fill:var(--mask); stroke:none; }
  #canvas .frame text { text-anchor:start; font-size:11px; font-weight:600; fill:var(--frame); }
  #canvas .wire { fill:none; stroke:var(--wire); stroke-width:1.5px; }
  #canvas .wire.seq { stroke:var(--wire-dash); stroke-dasharray:4 4; }
  #canvas .ah { fill:var(--wire); } #canvas .ahl { fill:var(--hl); }
  #canvas .hit { fill:none; stroke:transparent; stroke-width:12px; }
  #canvas .wg, #canvas .edgeLabel { cursor:pointer; }
  #canvas .wg.hov .wire { stroke:var(--wire-em); stroke-width:2.4px; }
  #canvas .edgeLabel rect { fill:var(--mask); stroke:none; }
  #canvas .edgeLabel.hov rect { stroke:var(--wire-em); stroke-width:.8px; }
  #canvas .lm { font-size:10px; fill:var(--fg); } #canvas .lt { font-size:9px; fill:var(--muted); }
  #canvas .hl-edge .wire { stroke:var(--hl) !important; stroke-width:3.5px !important; }
  #canvas .hl-node rect { stroke:var(--hl) !important; stroke-width:4px !important; }
  #canvas .hl-label rect { stroke:var(--hl); stroke-width:2px; }
  aside { border-left:1px solid var(--border); overflow:auto; padding:14px 16px; background:var(--panel); }
  aside h2 { font-size:16px; margin:0 0 2px; }
  aside h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 4px; }
  aside .sub { color:var(--muted); margin-bottom:6px; }
  aside ul { margin:4px 0; padding-left:18px; }
  aside li { margin:2px 0; }
  .chip { display:inline-block; font-family:ui-monospace,Consolas,monospace; font-size:11px; background:var(--panel);
          border:1px solid var(--border); border-radius:10px; padding:0 7px; margin:2px 3px 2px 0; }
  .sig { border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin:6px 0; background:var(--panel); font-size:13px; }
  .sig b { display:block; }
  .sig .kv { color:var(--muted); font-size:12px; }
  .gotcha { border-left:3px solid var(--hl); padding:2px 8px; margin:4px 0; font-size:13px; }
  .hint { color:var(--muted); font-size:12px; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--muted); margin-top:6px; }
  .legend span i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px; border:1px solid var(--border); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { border:1px solid var(--border); padding:4px 8px; text-align:left; vertical-align:top; }
  th { background:var(--panel); position:sticky; top:0; }
  .pad { padding:16px 20px; max-width:1100px; }
  .trace-step { border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin:8px 0; cursor:pointer; }
  .trace-step:hover { border-color:var(--accent); }
  .trace-step .n { font-weight:700; color:var(--hl); margin-right:6px; }
  h3.tr-h { font-size:15px; margin:22px 0 2px; }
  a.jump { color:var(--accent); cursor:pointer; } a.jump:hover { text-decoration:underline; }
  button.small { font:inherit; font-size:12px; padding:3px 10px; border:1px solid var(--border); border-radius:6px;
         background:var(--panel); color:var(--fg); cursor:pointer; }
  @media (max-width: 900px) { .wrap { grid-template-columns:1fr; height:auto; } #canvas { height:70vh; } aside { border-left:none; border-top:1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <h1>KTP-DT Architecture Explorer</h1>
  <div class="meta" id="meta"></div>
  <div class="legend" id="legend"></div>
</header>
<div id="banner"></div>
<nav class="tabs">
  <button data-v="diagram" class="on">Block diagram</button>
  <button data-v="trace">Follow a run</button>
  <button data-v="ports">Port map</button>
  <button data-v="repo">Repo map</button>
</nav>

<section class="view on" id="v-diagram">
  <div id="crumbs"></div>
  <div class="wrap">
    <div id="canvas"></div>
    <aside id="panel"></aside>
  </div>
</section>

<section class="view" id="v-trace"><div class="pad" id="trace"></div></section>
<section class="view" id="v-ports"><div class="pad" id="ports"></div></section>
<section class="view" id="v-repo"><div class="pad" id="repo"></div></section>

<script>
/* =============================================================================
 * HOW TO UPDATE THIS DOC (living document)
 * -----------------------------------------------------------------------------
 * Edit ONLY the MODEL object below. The renderer draws everything from it.
 *  - nodes:  id -> { title, sub (plain-English subtitle shown in block),
 *            summary, files [file names only, never paths], gotchas [],
 *            children [ids], dom (colour domain; inherited by children) }
 *            A node with children is a subsystem (click drills in).
 *  - edges:  { id?, from, to, label, transport, port, rate, src, seq? }
 *            Declare each signal ONCE between the most specific blocks.
 *            The renderer lifts it to whatever level is shown; signals
 *            crossing the opened block become In/Out ports.
 *            `src` = file name + symbol the port/rate comes from (grep it).
 *            `seq:true` = execution order arrow (dotted), not data.
 *  - traces: "Follow a run" walk-throughs [{ id, title, intro, steps:[{ level, edge?, node?, text }] }].
 *  - repo:   "Repo map" rows { path, node, what } — file/folder → owning block.
 *  - meta:   bump `updated` + the commit SHA whenever you re-verify against code.
 * On load an integrity check runs; a red banner lists broken ids.
 * Rule: code wins over docs. Verify ports/rates by grepping `src`.
 * ========================================================================== */
const MODEL = {
  meta: {
    version: "1.0", updated: "2026-09-30",
    repo: "cf2c185 + uncommitted working tree (GUI path fields, setup.bat prompts)"
  },

  domains: {
    web:   { name: "Browser front-end (JS)",            light: ["rgba(8,145,178,0.08)","#087f9c"], dark: ["rgba(26,157,193,0.14)","#66d9ef"] },
    host:  { name: "Host Python processes",             light: ["rgba(5,128,101,0.08)","#08755f"], dark: ["rgba(31,155,124,0.13)","#69dfbd"] },
    wsl:   { name: "WSL / Linux runtime (ArduPilot)",   light: ["rgba(181,120,15,0.08)","#a86609"], dark: ["rgba(197,145,43,0.13)","#ffd166"] },
    ext:   { name: "External programs & vendored libs", light: ["rgba(100,75,180,0.08)","#6757a8"], dark: ["rgba(120,105,196,0.14)","#b4a8ff"] },
    data:  { name: "Config, data & result files",       light: ["rgba(79,112,128,0.08)","#506f7e"], dark: ["rgba(84,119,139,0.18)","#a7cad9"] },
    model: { name: "Standalone analysis models",        light: ["rgba(47,95,196,0.08)","#2f5fc4"], dark: ["rgba(90,130,240,0.16)","#8fb0ff"] },
    tool:  { name: "Setup, tests & docs",               light: ["rgba(190,48,80,0.07)","#b32f50"], dark: ["rgba(199,76,104,0.13)","#ff8da1"] },
    ioport:{ name: "In/Out port (signal enters or leaves this block)", light: ["#f9fdff","#123344"], dark: ["#0a2031","#e3f6ff"] }
  },

  nodes: {
    root: { title: "KTP-DT", sub: "whole system",
      summary: "KTP-DT is a digital twin of a multirotor drone. A Python physics process (6-DOF rigid body, motors read from a database, wind gusts, ground contact) plays the real world for a real ArduPilot flight controller that runs on the PC inside WSL (Linux). The two swap messages over UDP port 9002 in strict lock-step: ArduPilot sends motor PWM, the twin answers with IMU/position/velocity/attitude. A browser GUI, served by a small FastAPI program, starts and stops both, shows live telemetry, and also hosts two design tools (flight-time estimator, propulsion model) that share the same motor/battery database. Output of KTP 10088368 (Digital Twin System).",
      gotchas: ["Click any block with ▸ to open it. Click a wire (or its label) to see exactly what travels on it.",
                "Two ways to run: through the GUI (Windows + WSL) or headless (`python Src/DT/main.py` + start ArduPilot by hand)."],
      children: ["browser","gui_server","dt","fc","design","prop","db","cfg","results","ext_gcs","tools"] },

    /* =========================== BROWSER =========================== */
    browser: { title: "Browser GUI", sub: "single-page app you click", dom: "web",
      summary: "Plain JavaScript page (no build step) served at http://127.0.0.1:8080. Three tabs: Simulator (Setup + Live Data), Flight Time, Propulsion Model. It talks to the GUI server with fetch() for one-off calls and one WebSocket for the live telemetry stream.",
      files: ["index.html","app.js","styles.css"],
      gotchas: ["app.js is an ES module loaded with <script type=module>; three.js is resolved through an import map to the vendored copy — no CDN, works offline."],
      children: ["ui_shell","ui_status","ui_setup","ui_live","ui_flight","ui_prop","ui_vendor"] },
    ui_shell: { title: "Tab shell + boot", sub: "showTab / showSubtab / boot()",
      summary: "Switches between tabs and sub-tabs, and on load runs boot(): fetch /api/options (fills the parameter-file, motor and battery drop-downs), fetch the startup config into the text box, fetch /api/status (pre-fills ArduPilot dir and venv fields from the saved state), wire every button, then open the WebSocket.",
      files: ["app.js"],
      gotchas: ["showSubtab is scoped to its parent tab — a document-wide version once blanked the Simulator after visiting the Propeller sub-tab.",
                "If boot() throws, the error text lands in the Setup status line."] },
    ui_status: { title: "Status bar", sub: "Realtime · CPU · FPS · t · Connected",
      summary: "Persistent strip under the header, refreshed by the 'status' messages the physics process sends about every 10 s of wall-clock time. Realtime ≥ 90 % green, ≥ 70 % amber, else red; CPU is green up to 50 %, amber up to 75 %; Connected shows whether ArduPilot has spoken to the twin.",
      files: ["app.js"],
      gotchas: ["Realtime % = simulated seconds ÷ wall seconds over the last window; below 100 % the sim is slower than real time."] },
    ui_setup: { title: "Simulator ▸ Setup", sub: "launch card + config editor",
      summary: "Everything needed to start a run: pick a parameter file, host IP, ArduPilot directory and venv (WSL paths), optional EEPROM wipe, then Launch / Stop. Next to it, the startup_config.json editor.",
      files: ["index.html","app.js"],
      children: ["su_launch","su_ip","su_cfg","su_wipe"] },
    su_launch: { title: "Launch / Stop", sub: "POST /api/launch · /api/stop",
      summary: "Sends {param_file, ip, ardupilot_dir, venv_activate, config} to the server. The result (status JSON, or 'Error: …' text from a 409) is printed under the buttons. ArduPilot dir and venv start pre-filled from what setup.bat saved; whatever you launch with becomes the new default.",
      files: ["app.js"],
      gotchas: ["Launch only works on Windows with WSL (the server shells out to wsl.exe)."] },
    su_ip: { title: "Host IP + Detect", sub: "where WSL sends UDP",
      summary: "The Host IP field is the address ArduPilot (inside WSL) sends to. 'Detect IP' asks the server to read WSL's default-route gateway, which is the Windows host as seen from WSL.",
      files: ["app.js"],
      gotchas: ["The field starts as 127.0.0.1 and is sent as-is; the server only auto-detects when the field is EMPTY. On Windows + WSL click Detect IP first, otherwise ArduPilot's packets go to WSL's own loopback and never reach the twin."] },
    su_cfg: { title: "Startup config editor", sub: "startup_config.json text box",
      summary: "Textarea showing the whole startup config as JSON. 'Save config' PUTs it back; Launch also writes it (the server saves the box contents before starting anything).",
      files: ["app.js"],
      gotchas: ["No validation beyond JSON.parse — a wrong key name is silently ignored by the twin (see Twin config)."] },
    su_wipe: { title: "Wipe EEPROM checkbox", sub: "-w on/off",
      summary: "Checkbox 'Wipe EEPROM on launch (-w)'. Ticking it sets sitl.preserve_eeprom = false inside the JSON in the box (unticked → true). The launcher turns preserve_eeprom = false into ArduPilot's -w flag.",
      files: ["app.js"],
      gotchas: ["Default is preserve (no -w): parameters changed in an earlier run stay in ArduPilot's eeprom.bin and can override the .parm file."] },

    ui_live: { title: "Simulator ▸ Live Data", sub: "streaming plots + 3D",
      summary: "Lazy-started the first time you open the tab: builds the ring buffers, four uPlot charts and the three.js scene, then draws whatever the WebSocket delivers.",
      files: ["app.js"],
      gotchas: ["Telemetry frames that arrive BEFORE the Live Data tab is first opened are dropped (only status messages are handled), so plots start empty when opened."],
      children: ["lv_ws","lv_ring","lv_charts","lv_3d","lv_cards"] },
    lv_ws: { title: "WebSocket client", sub: "connectWS()",
      summary: "Opens ws://host/ws/telemetry, parses each JSON frame, routes type 'status' to the status bar and type 'telemetry' to the live view. Reconnects every 1.5 s if the socket closes.",
      files: ["app.js"] },
    lv_ring: { title: "Ring buffers", sub: "600 points per signal",
      summary: "Typed-array ring buffers (O(1) push, no shift) for time, accel×3, gyro×3, altitude, wind×3. 600 points ≈ 12 s of history at 50 Hz. 'Clear' swaps in empty buffers.",
      files: ["app.js"] },
    lv_charts: { title: "Charts (uPlot)", sub: "accel · gyro · altitude · wind",
      summary: "Four uPlot line charts redrawn at most once per animation frame (requestAnimationFrame), resized by a debounced ResizeObserver. Skipped while the tab is hidden.",
      files: ["app.js"] },
    lv_3d: { title: "3D trajectory (three.js)", sub: "E / N / Up trail",
      summary: "Orbit-controllable scene with grid, axes, a 600-point trail and a marker at the current position. NED position is mapped to three.js as x = East, y = Up, z = North.",
      files: ["app.js"],
      gotchas: ["If the vendored three.js fails to import, the panel shows an error text and the rest of the page keeps working."] },
    lv_cards: { title: "Readout cards", sub: "altitude · wind · accel · gyro",
      summary: "Four <output> boxes with the latest numbers.",
      files: ["index.html","app.js"],
      gotchas: ["'Accel' shows the twin's body acceleration (≈ 0 in a steady hover, gravity is inside it), not the IMU-style specific force ArduPilot receives (≈ −g on Z in hover)."] },

    ui_flight: { title: "Flight Time tab", sub: "form → /api/flight-time",
      summary: "Aircraft (structural/payload mass, max empty weight), motor + battery + counts, flight parameters (bank angle, required and flight T/W, avionics power). Calculate posts the form and shows flight time, MTOW, empty weight, payload ratio, power, battery energy, depth of discharge and motor throttle as cards; errors (e.g. 'motor cannot meet required thrust ratio') are shown in red.",
      files: ["index.html","app.js"] },
    ui_prop: { title: "Propulsion Model tab", sub: "motor · propeller sub-tabs",
      summary: "Two independent calculators with the same layout: inputs → Calculate → result cards → four uPlot charts.",
      files: ["index.html","app.js"],
      children: ["pp_motor","pp_prop"] },
    pp_motor: { title: "Motor Model", sub: "DC motor operating point",
      summary: "Inputs: Kv, Rm, I0, k_iron, battery V, ESC efficiency, throttle, winding temperature, load torque. Cards: RPM, current, torque, shaft/electrical power, efficiency. Charts: RPM, current, torque, efficiency versus throttle (19-point sweep).",
      files: ["app.js"] },
    pp_prop: { title: "Propeller Model", sub: "blade-element rotor solve",
      summary: "Inputs: diameter, pitch (inches), blades, airfoil name (free text + presets), RPM, climb velocity. Cards: thrust, torque, aero power, CT, CQ, efficiency, geometry source. Charts: dT/dr, dQ/dr, angle of attack, tip-loss factor versus r/R.",
      files: ["app.js"],
      gotchas: ["Only diameter/pitch combinations with a matching APC .PE0 file work; otherwise the server answers 400 'No APC geometry matches …'."] },
    ui_vendor: { title: "Vendored libraries", sub: "uPlot · three.js · OrbitControls", dom: "ext",
      summary: "Third-party JavaScript copied into gui/static/vendor so the GUI needs no internet: uPlot (2D time-series), three.js (ES module) and its OrbitControls.",
      files: ["uPlot.iife.min.js","three.module.js","OrbitControls.js"] },

    /* =========================== GUI SERVER =========================== */
    gui_server: { title: "GUI server", sub: "python -m gui (FastAPI + uvicorn)", dom: "host",
      summary: "One Python process on the host PC. It serves the web page, answers the JSON API, relays telemetry to browsers over a WebSocket, and — through the launcher — starts and stops the physics process and the ArduPilot SITL. It never simulates anything itself.",
      files: ["__main__.py","server.py","config_io.py","launcher.py","telemetry.py"],
      children: ["srv_entry","srv_static","srv_api","srv_cfgio","launcher","telem_hub"] },
    srv_entry: { title: "Entry point", sub: "python -m gui",
      summary: "Parses --port (8080), --host (127.0.0.1), --no-browser; refuses to start if the port is already taken; opens the browser after 1 s; runs uvicorn with create_app(). On app startup it starts the telemetry thread; on shutdown it stops it and stops any running simulation.",
      files: ["__main__.py","server.py"],
      gotchas: ["This is the ONLY way the GUI starts (per its docstring).",
                "Closing the server also runs launcher.stop() — it kills the twin and pkills ArduPilot in WSL."] },
    srv_static: { title: "Static files", sub: "/ → gui/static, no-store",
      summary: "Serves index.html, app.js, styles.css and vendor/ from gui/static. Every response carries Cache-Control: no-store.",
      files: ["server.py"],
      gotchas: ["The no-store middleware exists because a stale cached app.js paired with a fresh index.html silently broke the page."] },
    srv_api: { title: "API routes", sub: "REST + WebSocket in server.py",
      summary: "The eight endpoint groups the browser uses. Slow work (SQLite, subprocess, BEMT solve) runs in worker threads via asyncio.to_thread so the event loop stays responsive. Input problems come back as HTTP 400 with the error text; launch problems as 409.",
      files: ["server.py"],
      children: ["api_options","api_config","api_status","api_launch","api_flight","api_motor","api_rotor","api_ws"] },
    api_options: { title: "GET /api/options", sub: "drop-down contents",
      summary: "Returns {param_files, drone_models, motors, batteries}: *.parm/*.param names in the param folder, drone JSON stems, and motor/battery names from the database.",
      files: ["server.py","config_io.py"],
      gotchas: ["drone_models is returned but no control in the GUI uses it — the twin reads drone_model from the startup config."] },
    api_config: { title: "/api/config/{name}", sub: "read / write JSON config",
      summary: "GET returns and PUT atomically writes 'startup' (startup_config.json) or 'drone:<name>' (a drone JSON). PUT accepts {data: …} or the raw object; 404 unknown/missing, 400 bad JSON.",
      files: ["server.py","config_io.py"],
      gotchas: ["Only 'startup' is used by the GUI; drone:<name> is reachable by API only."] },
    api_status: { title: "/api/status · /api/detect-ip", sub: "saved paths + WSL host IP",
      summary: "status → {backend_running, sitl_running, host_ip, param_file, ardupilot_dir, venv_activate}. detect-ip[?force=true] → WSL's default-route IP, cached in gui_state.json.",
      files: ["server.py","launcher.py"] },
    api_launch: { title: "POST /api/launch · /api/stop", sub: "start / stop a run",
      summary: "launch: 400 if param_file is missing; saves the posted config to startup_config.json, then runs LaunchManager.launch (any failure → 409 with the message). stop: kills the physics process and the WSL processes.",
      files: ["server.py","launcher.py"] },
    api_flight: { title: "POST /api/flight-time", sub: "flight-time estimate",
      summary: "Adds Src/Design-config-tool to sys.path on first call, then runs calculate_flight_time(body, verbose=False) in a thread. KeyError/ValueError/IndexError → 400.",
      files: ["server.py"],
      gotchas: ["max_empty_weight has no default in the calculator — leaving it out gives a 400 'max_empty_weight'."] },
    api_motor: { title: "POST /api/propulsion/motor", sub: "motor point + sweep",
      summary: "Solves the requested operating point, then re-solves 19 throttle values from 0.1 to 1.0 (all with the same voltage and load) and returns everything, numpy arrays converted to lists.",
      files: ["server.py"] },
    api_rotor: { title: "POST /api/propulsion/propeller", sub: "rotor BEMT solve",
      summary: "Converts inches → metres, looks up blade geometry, builds airfoil polars, runs the rotor solver with radial output, adds r/R, geometry source and the APC file name.",
      files: ["server.py"],

                "The rotor_channels and pwm arguments are accepted but unused."] },
    dt_viz: { title: "3D viewer (matplotlib)", sub: "separate process, off by default",
      summary: "run_viz() in its own process: fixed world axes (E, N, Up), ground grid, a small quadcopter icon with body-axis arrows, redraws every 33 ms from the newest queue message. Auto-grows the axes if the drone leaves them.",
      files: ["viz3d.py"] },

    /* =========================== ARDUPILOT =========================== */
    fc: { title: "ArduPilot SITL", sub: "flight controller in WSL (external)", dom: "wsl",
      summary: "Not part of this repo: an ArduPilot clone (Copter-4.6) that you build once following the SITL install guide. The GUI starts it with sim_vehicle.py inside WSL. It is the same flight code that runs on real hardware; only its physics backend is swapped for the JSON link to the digital twin.",
      files: ["sim_vehicle.py","arducopter"],
      children: ["ap_sv","ap_json","ap_est","ap_ctrl","ap_par","ap_mav","ap_lua"] },
    ap_sv: { title: "sim_vehicle.py", sub: "starts arducopter + MAVProxy",
      summary: "ArduPilot's SITL launcher. Started with `-v ArduCopter -f quad --no-rebuild --model JSON:<host ip> --out=udp:<host ip>:14551 --add-param-file=… [-w]`.",
      files: ["sim_vehicle.py"],
      gotchas: ["--no-rebuild assumes the binary already exists: do the first build by hand (SITL guide, step 5).",
                "Start order matters: the twin must already be listening, or MAVProxy exits / ArduPilot waits."] },
    ap_json: { title: "JSON physics backend", sub: "the link to the twin",
      summary: "Every control loop: send a binary frame (magic, frame rate, frame count, PWM ×16) to <host ip>:9002 and block until a JSON reply comes back. That block is what makes the pair run in lock-step.",
      gotchas: ["No reply → ArduPilot just waits (no simulated time passes)."] },
    ap_est: { title: "Sensors + state estimator", sub: "IMU in, EKF3 or ground truth",
      summary: "Takes the IMU (gyro, accel) from the twin and builds GPS, barometer and compass readings itself from the true position and attitude the twin sends (ArduPilot's own SITL sensor models), then estimates attitude, position and velocity.",
      gotchas: ["The two shipped parameter files differ in ONE line: AHRS_EKF_TYPE = 3 (EKF3, dt-ekf-paper.parm) versus 10 (SITL ground truth, dt-ground-truth-paper.parm)."] },
    ap_ctrl: { title: "Flight control", sub: "modes → motor PWM",

    ap_par: { title: "Parameters + EEPROM", sub: ".parm defaults, eeprom.bin",
      summary: "The selected .parm (≈ 1400 parameters) is applied with --add-param-file on top of ArduPilot's defaults. Values live in a simulated EEPROM that survives restarts unless -w is passed.",
      gotchas: ["Leftover values from earlier runs can shadow the .parm unless Wipe EEPROM is ticked."] },
    ap_mav: { title: "MAVProxy + MAVLink out", sub: "GCS telemetry",
      summary: "MAVProxy sits between ArduPilot and ground-control programs. --out=udp:<host ip>:14551 forwards the MAVLink stream to the Windows side so any GCS can watch or command the simulated drone." },
    ap_lua: { title: "Lua scripting", sub: "fault injection (optional)",

      gotchas: ["These faults act inside ArduPilot's SITL sensor layer, not in the digital twin."] },

    ext_gcs: { title: "Ground-control software", sub: "optional MAVLink listener", dom: "ext",
      summary: "Any GCS (Mission Planner, QGroundControl, MAVProxy console…) listening on UDP 14551 on the host sees the simulated drone. This repo does not ship or require one; the browser GUI does not decode MAVLink.",
      gotchas: ["Useful for uploading missions and Lua scripts; otherwise copy scripts into <ardupilot>/scripts by hand."] },

    /* =========================== DESIGN TOOL =========================== */
    design: { title: "Design-config tool", sub: "flight-time estimator", dom: "model",
      summary: "Pure calculation: given a motor, a battery and an airframe mass budget, how long can it hover or fly at a chosen thrust-to-weight? Runs in the GUI server (Flight Time tab) or as a command-line script.",
      files: ["flight_time_calc.py"],
      children: ["dc_cli","dc_calc"] },
    dc_cli: { title: "CLI", sub: "flight_time_calc.py --help",
      summary: "Loads drone_config.json as the base, overwrites any field given as a flag, runs the calculation, asserts the result is finite and > 0 and prints every field.",
      files: ["flight_time_calc.py"],
      gotchas: ["drone_config.json keys g and voltage_check are not read by the calculator."] },
    dc_calc: { title: "calculate_flight_time()", sub: "seven steps",
      summary: "Two-stage T/W logic: capability check at required_twr, then operating point at flight_twr, then energy ÷ power.",
      files: ["flight_time_calc.py"],
      children: ["ft_pick","ft_mtow","ft_cap","ft_op","ft_pwr","ft_batt","ft_time"] },
    ft_pick: { title: "1 · Pick parts", sub: "by name or index",
      summary: "Chooses motor and battery from the database lists by name (case-insensitive) or integer index; reads counts and masses with defaults (4 motors, 1 battery, 0.6 kg structure, 0.1 kg payload).",
      files: ["flight_time_calc.py"],
      gotchas: ["Index means position in each list: motors in motor_id order, batteries in alphabetical order."] },
    ft_mtow: { title: "2 · Mass budget", sub: "MTOW, empty weight",
      summary: "MTOW = structure + payload + n·motor_mass + n_bat·battery_mass; empty = MTOW − payload. Rejects if empty > max_empty_weight.",
      files: ["flight_time_calc.py"] },
    ft_cap: { title: "3 · Capability check", sub: "can it reach required T/W?",
      summary: "Per-motor requirement = (required_twr ÷ cos(bank)) ÷ n. Motor curve T/W = thrust_g ÷ (MTOW·1000). Raises 'motor cannot meet required thrust ratio' if the curve never gets there.",
      files: ["flight_time_calc.py"] },
    ft_op: { title: "4 · Operating point", sub: "first throttle that reaches flight T/W",
      summary: "First curve row where T/W ≥ (flight_twr ÷ cos(bank)) ÷ n; its power_w is the per-motor cruise power.",
      files: ["flight_time_calc.py"] },
    ft_pwr: { title: "5 · Total power", sub: "avionics + motors",
      summary: "P_total = avionics_power (6 W default) + n·P_motor.",
      files: ["flight_time_calc.py"] },
    ft_batt: { title: "6 · Battery energy", sub: "depth of discharge",
      summary: "DoD = (Vmax − Vland)/(Vmax − Vmin); usable Wh = charge_Ah · V_nominal · DoD; total = n_bat · usable.",
      files: ["flight_time_calc.py"] },
    ft_time: { title: "7 · Flight time", sub: "t = E·60 / P",
      summary: "flight_time_min = energy_Wh · 60 / P_total, returned with MTOW, empty weight, payload ratio, chosen throttle, DoD, max raw thrust and the part names.",
      files: ["flight_time_calc.py"] },

    /* =========================== PROPULSION MODEL =========================== */
    prop: { title: "Propulsion model", sub: "DC motor + blade-element rotor", dom: "model",
      summary: "Package aerodynamic_model (pip install -e Src/Propulsion-model). A motor equivalent-circuit solver and a propeller blade-element-momentum solver. Used by the Propulsion tab and the command line only.",
      files: ["motor.py","single_rotor.py","geometry.py","airfoil.py","atmosphere.py"],
      gotchas: ["Not wired into the digital twin: the twin's motors come from measured/synthetic curves in the database, not from these solvers. The motor and propeller are deliberately separate — no coupled solver ships."],
      children: ["pm_motor","pm_rotor","pm_cli","pm_apc","pm_polars"] },
    pm_motor: { title: "DC motor model", sub: "solve_motor_equilibrium()",
      summary: "Kv_si = Kv·2π/60; Rm_eff = Rm·(1 + 0.004(T − 20)); V_eff = η_ESC·throttle·V_batt; ω = (V_eff/Rm − I0 − τ_load·Kv_si)/(1/(Kv_si·Rm) + k_iron); I = max((V_eff − ω/Kv_si)/Rm, I0 + k_iron·ω); torque = (I − I0 − k_iron·ω)/Kv_si. Returns rpm, current, torque, shaft and electrical power, efficiency.",
      files: ["motor.py"],
      gotchas: ["Fixed external load torque (bench-style), not derived from a propeller.",
                "Zero effective voltage returns an all-zero result instead of raising."] },
    pm_rotor: { title: "BEMT single rotor", sub: "geometry + polars → thrust",
      summary: "Blade-element momentum: split the blade into stations, solve inflow angle at each so momentum and blade-element forces agree, integrate thrust and torque.",
      files: ["single_rotor.py","geometry.py","airfoil.py","atmosphere.py"],
      children: ["pr_geo","pr_air","pr_atm","pr_bemt","pr_solve"] },
    pr_geo: { title: "Blade geometry", sub: "get_blade_geometry()",
      summary: "Scans the APC .PE0 files, parses diameter×pitch from each file name, and takes the closest one if the combined relative error is ≤ 6 %. Resamples chord to 20 stations and sets twist from pitch: atan(P/(2π·r)).",
      files: ["geometry.py"],
      gotchas: ["No match → NotImplementedError 'No APC geometry matches …'."] },
    pr_air: { title: "Airfoil polars", sub: "get_airfoil_polars()",
      summary: "Cl/Cd versus angle of attack (−5…25°, 61 points) for Reynolds numbers 10 k…1 M from NeuralFoil. Cached in memory and on disk (md5 key). Without NeuralFoil it falls back to thin-airfoil theory plus an Oswald drag term with a warning.",
      files: ["airfoil.py"],
      gotchas: ["Optional dependencies neuralfoil / aerosandbox: without them the airfoil name has no real effect."] },
    pr_atm: { title: "Atmosphere", sub: "ρ = 1.225 kg/m³",
      summary: "Sea-level constants (RHO_SL, NU_SL) used as defaults. An ISA altitude class also exists but the solvers do not use it yet.",
      files: ["atmosphere.py"] },
    pr_bemt: { title: "pyBEMT (submodule)", sub: "upstream equations", dom: "ext",
      summary: "Third-party pyBEMT library pulled in as a git submodule. Its section equations are used unchanged; its bundled airfoil table is the fallback when no polars are supplied.",
      files: ["pybemt"],
      gotchas: ["Empty folder until `git submodule update --init --recursive` (setup script does it)."] },
    pr_solve: { title: "Rotor solver", sub: "solve_single_rotor()",
      summary: "Per station: bisect for inflow angle φ in [0.01π, 0.9π] (fallback: 3600-point brute-force scan), Prandtl tip loss, Cl/Cd at the local Reynolds number ρ|ω|rc/μ. Sums T and Q, P = Qω, CT, CQ, CP, advance ratio J, efficiency. Optionally returns radial arrays for plotting.",
      files: ["single_rotor.py"],
      gotchas: ["rpm ≤ 0 short-circuits to an all-zero result."] },
    pm_cli: { title: "Command-line scripts", sub: "motor.py · single_rotor_analysis.py",
      summary: "motor.py runs the DC motor solver from flags. single_rotor_analysis.py runs the rotor solve, optionally sweeping D, P, RPM or climb velocity, with matplotlib figures (--no-plots for a table only).",
      files: ["motor.py","single_rotor_analysis.py"] },
    pm_apc: { title: "APC geometry data", sub: "data/apc_geo/PE0-FILES_WEB", dom: "data",
      summary: "Several thousand APC propeller performance files (.PE0) committed to the repo; only the chord distribution and the D×P in the file name are used.",
      files: ["*.PE0"] },
    pm_polars: { title: "Polar cache", sub: "data/polars_cache/*.pkl", dom: "data",
      summary: "Disk cache of computed airfoil polars. Git-ignored; safe to delete.",
      files: ["*.pkl"] },

    /* =========================== DATABASE =========================== */
    db: { title: "Motor & battery database", sub: "SQLite + two readers", dom: "data",
      summary: "One SQLite file holds every motor curve and battery. Two independent readers use it: a dictionary-style API for the design tool and the GUI drop-downs, and a NumPy-based loader with a pickle cache that the physics model uses.",
      files: ["Motor_battery_database.sqlite"],
      children: ["db_file","db_seed","db_dc","db_sim"] },
    db_file: { title: "SQLite file", sub: "Motor_battery_database.sqlite",
      summary: "Tables: motors, motor_performance (throttle, V, I, P, rpm, torque, thrust, efficiency), motor_specs, batteries, plus motor_raw_data and battery_processed. Ships with 3 generic motors (Motor-A 920KV 10x4.5, Motor-B 750KV 18x6, AIR2216 KV920 -10*4.5) and 3 batteries (4S LiPo 5000 mAh, 6S LiPo 5000 mAh, 4S Lion 7000 mAh).",

    db_seed: { title: "Seed script", sub: "build_db.py",

    db_dc: { title: "Design-tool DB API", sub: "db_api · db_schema · db_loader",

      files: ["db_api.py","db_schema.py","db_loader.py"],

    db_sim: { title: "Physics-model loader", sub: "motor_battery_db.py",

      files: ["motor_battery_db.py","config.py"],

    dbs_sql: { title: "SQL read", sub: "motors ⋈ motor_performance",
      summary: "One JOIN grouped by motor name, arrays sorted by throttle (np.interp needs it); batteries read separately.",
      files: ["motor_battery_db.py"] },
    dbs_cache: { title: "Cache logic", sub: "memo → pickle → SQLite",
      summary: "In-memory memo first; else cache/motor_database.pkl and battery_database.pkl; else read SQLite and write the pickles. If the SQLite file is newer than the motor pickle, it reloads.",
      files: ["motor_battery_db.py"],
      gotchas: ["Pickles are git-ignored, so the first run after a clone builds them.",
                "Only the motor pickle's timestamp is compared with the database."] },
    dbs_lookup: { title: "MotorLookup", sub: "101-point throttle grid",
      summary: "MotorLookup.from_record resamples thrust, torque, power, current and rpm onto throttle 0.00…1.00 with np.interp once; per-tick lookups use direct indexing.",
      files: ["motor_battery_db.py"] },

      files: ["dt-ekf-paper.parm","dt-ground-truth-paper.parm"],

  traces: [
    { id:"launch", title: "Launch sequence: from a click to a flying simulation",
      intro: "What happens between pressing Launch and the first telemetry point on screen. Click a step to jump to that level with the relevant block or wire highlighted.",
      steps: [
        { level:"gui_server", node:"srv_entry", text:"You run `python -m gui`. FastAPI serves the page on port 8080, starts the telemetry thread and opens your browser." },
        { level:"browser", node:"ui_shell", text:"The page boots: it loads the parameter-file, motor and battery lists, the startup config, and the saved ArduPilot dir / venv, then opens the WebSocket." },
        { level:"browser", edge:"http_launch", text:"On the Setup tab you pick a parameter file, click Detect IP, check the paths and press Launch. The browser posts everything, including the config text box, to /api/launch." },
        { level:"launcher", node:"lm_checks", text:"The server saves the config, works out the host IP, then checks that ArduPilot really exists in WSL. Any failure stops here with a clear message and nothing has been started." },
        { level:"launcher", edge:"spawn_dt", text:"The physics process starts first (python main.py with telemetry switched on), so its UDP socket is ready before ArduPilot speaks." },
        { level:"launcher", node:"lm_cmd", text:"The launcher builds the WSL command: convert paths, copy the .parm into ~/.dt_params with line endings fixed, and call sim_vehicle.py with --model JSON:<ip>." },
        { level:"launcher", edge:"spawn_wsl", text:"A Windows Terminal tab (or console) opens running that command inside WSL — that window is ArduPilot's boot log and MAVProxy." },
        { level:"dt", node:"dt_boot", text:"Meanwhile the twin loaded its two JSON files, built the vehicle from the motor database, bound UDP 9002 and is now blocked waiting for a frame." },
        { level:"dt_link", edge:"pwm", text:"ArduPilot finishes booting and sends its first PWM frame. The twin prints 'Connected to …' and remembers the sender address. Lock-step begins." },
        { level:"root", edge:"ws_tel", text:"The twin publishes telemetry on ZMQ 9010; the GUI server keeps only the newest frame and pushes it to every browser over the WebSocket." },
        { level:"browser", node:"ui_live", text:"Open Live Data: the charts and 3D trail start filling, and the status bar shows Realtime %, CPU, FPS and Connected." },
        { level:"launcher", node:"lm_stop", text:"Stop kills the physics process and pkills sim_vehicle / arducopter / mavproxy inside WSL." }
      ] },
    { id:"tick", title: "One physics frame: PWM in, state out",
      intro: "A single lock-step exchange, about 400 times per simulated second. Neither side moves until the other answers.",
      steps: [
        { level:"fc", edge:"ap_mix", text:"ArduPilot finishes one control loop; the motor mixer has produced a PWM value for every motor." },
        { level:"dt_link", edge:"pwm", text:"ArduPilot sends one binary frame over UDP 9002 and then blocks, waiting for the reply." },
        { level:"dt_link", node:"lk_seq", text:"The twin checks the magic and length, spots restarts, duplicates and missed frames, and returns the PWM array." },
        { level:"dt_loop", node:"lp_dt", text:"The main loop picks dt = min(1/frame rate, 1/400 s) and calls sim.tick(pwm, dt)." },
        { level:"dt_sim", edge:"tick", text:"Inside the physics: PWM is turned into throttle 0…1, optionally smoothed by the motor lag, and looked up in the motor database curve." },
        { level:"s_motor", node:"mo_moment", text:"Each rotor gives thrust along −Z body plus a moment from its arm and a reaction torque from its spin direction." },
        { level:"dt_sim", edge:"sum", text:"Ground contact (spring-damper), Dryden gust and drag (when airborne) and gravity are added: total force and moment on the body." },
        { level:"s_rk4", node:"rk_stages", text:"Four RK4 evaluations of the rigid-body equations advance position, velocity, attitude and rates by dt." },
        { level:"s_rk4", edge:"commit", text:"The new 13-state vector is committed to the StateVector, which recomputes the rotation matrix, Euler angles, NED velocity and latitude/longitude. The full plant walk-through is in trace C." },
        { level:"dt_link", edge:"fdm", text:"The connector converts to what ArduPilot expects — gyro, body acceleration with gravity removed, position, velocity, attitude — and sends it as one JSON line to the same address." },
        { level:"fc", edge:"ap_sens", text:"ArduPilot reads the reply as sensor data, synthesises GPS/baro/compass itself, and its estimator produces the next attitude/position estimate. Then the loop repeats." },
        { level:"dt_loop", node:"lp_telem", text:"After replying, the twin does its side work: a 50 Hz telemetry snapshot, a status message every 10 s, an optional 3D frame, and one CSV row." }
      ] },
    { id:"plant", title: "Inside the drone plant: PWM in, states out (one tick)",
      intro: "The same frame as B, zoomed into the drone plant. Every tick the plant receives pwm[16] and dt, runs eight stages in order, and updates the StateVector that the rest of the twin reads. Steps that highlight a wire list the exact signals on it in the side panel.",
      steps: [
        { level:"dt_sim", edge:"tick", text:"Input: the main loop hands the plant pwm[16] in microseconds plus dt (and, after an ArduPilot restart, a reset). The plant also holds its previous state — the feedback wires from the StateVector on the right." },
        { level:"dt_sim", edge:"thr", text:"Stage 1 · each rotor picks its own channel (pwm_ch) and converts it to throttle: (pwm − 1000)/(2000 − 1000), clipped to 0…1. For generic_quad the four rotors use channels 1, 4, 2, 3." },

/* =============================================================================
 * RENDERER — no content below this line
 * ========================================================================== */
const N = MODEL.nodes, E = MODEL.edges;
const parent = {};
for (const [id, n] of Object.entries(N)) for (const c of (n.children || [])) parent[c] = id;
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ancestors = id => { const a = []; while (id) { a.push(id); id = parent[id]; } return a; }; // self → root
const domOf = id => { for (const a of ancestors(id)) if (N[a].dom) return N[a].dom; return "data"; };
const within = (id, top) => ancestors(id).includes(top);
const title = id => N[id] ? N[id].title : id;

/* ---- integrity check (silent unless broken) ---- */
function check() {
  const errs = [], seen = {};
  for (const [id, n] of Object.entries(N)) {
    if (!n.title) errs.push(`node ${id}: missing title`);
    for (const c of (n.children || [])) {
      if (!N[c]) errs.push(`node ${id}: child '${c}' does not exist`);
      if (seen[c]) errs.push(`node '${c}' has two parents (${seen[c]}, ${id})`);
      seen[c] = id;
    }
    if (id !== "root" && !within(id, "root")) errs.push(`node '${id}' is not reachable from root`);
  }
  const ids = new Set();
  E.forEach((e, i) => {
    for (const k of ["from","to"]) if (!N[e[k]]) errs.push(`edge #${i} (${e.label||"seq"}): ${k} '${e[k]}' does not exist`);
    if (e.from === e.to) errs.push(`edge #${i}: from == to`);
    if (e.id) { if (ids.has(e.id)) errs.push(`duplicate edge id '${e.id}'`); ids.add(e.id); }
  });
  MODEL.traces.forEach(tr => tr.steps.forEach((t, i) => {
    const w = `trace '${tr.id}' step ${i+1}`;
    if (!N[t.level] || !N[t.level].children) errs.push(`${w}: level '${t.level}' is not a subsystem`);
    if (t.edge && !ids.has(t.edge)) errs.push(`${w}: edge id '${t.edge}' not found`);
    if (t.node && !N[t.node]) errs.push(`${w}: node '${t.node}' not found`);
    if (t.node && N[t.level] && !within(t.node, t.level)) errs.push(`${w}: node '${t.node}' is not inside level '${t.level}'`);
  }));
  MODEL.repo.forEach(r => { if (!N[r.node]) errs.push(`repo row '${r.path}': node '${r.node}' does not exist`); });
  if (errs.length) { const b = $("#banner"); b.style.display = "block"; b.textContent = "MODEL integrity check failed:\n" + errs.join("\n"); }
}

/* ---- edge lifting: resolve an endpoint to what is visible inside `cur` ---- */
function lift(id, cur) {
  const a = ancestors(id);
  const i = a.indexOf(cur);
  if (i > 0) return { kind:"in", id:a[i-1] };          // a child of cur (or deeper) → that child
  if (i === 0) return { kind:"self" };                  // the opened block itself
  // outside: name it by the nearest context level (sibling of cur or of an ancestor of cur)
  for (const p of ancestors(cur).slice(1)) { const j = a.indexOf(p); if (j > 0) return { kind:"out", id:a[j-1] }; }
  return { kind:"out", id:a[a.length-1] };
}

function levelGraph(cur) {
  const kids = N[cur].children, wires = new Map(), inPorts = new Map(), outPorts = new Map();
  E.forEach((e, idx) => {
    const a = lift(e.from, cur), b = lift(e.to, cur);
    let from, to;
    if (a.kind === "in" && b.kind === "in") { if (a.id === b.id) return; from = a.id; to = b.id; }
    else if (a.kind === "in" && b.kind !== "in") { if (b.kind === "self") return; to = "out:" + b.id; outPorts.set(b.id, 1); from = a.id; }
    else if (b.kind === "in" && a.kind !== "in") { if (a.kind === "self") return; from = "in:" + a.id; inPorts.set(a.id, 1); to = b.id; }
    // whole-block signals (endpoint is the opened block itself) wire to its frame
    else if (a.kind === "self" && b.kind === "out") { from = "frame"; to = "out:" + b.id; outPorts.set(b.id, 1); }
    else if (a.kind === "out" && b.kind === "self") { from = "in:" + a.id; inPorts.set(a.id, 1); to = "frame"; }
    else return;
    // one wire per direction per block pair, so every input and output has its own arrow
    const key = from + ">" + to;
    if (!wires.has(key)) wires.set(key, { from, to, edges: [] });
    wires.get(key).edges.push(idx);
  });
  return { kids, wires: [...wires.values()], inPorts: [...inPorts.keys()], outPorts: [...outPorts.keys()] };
}

const short = t => t.length > 28 ? t.slice(0, 26) + "…" : t;

/* ---- layout (ELK layered: In ports pinned left, Out ports pinned right, orthogonal wires) ---- */
const FONT = '"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
const ctx2d = document.createElement("canvas").getContext("2d");
const tw = (s, px, bold) => { ctx2d.font = `${bold ? "600 " : ""}${px}px ${FONT}`; return ctx2d.measureText(s).width; };
const elk = new ELK();
let wireList = [], showLabels = true, labelOverride = null;

function wireText(w) {
  const data = w.edges.map(i => E[i]).filter(e => !e.seq);
  if (!showLabels || !data.length) return [];
  if (data.length > 1) return [`${short(data[0].label)} (+${data.length-1})`];
  const e0 = data[0]; return e0.port ? [short(e0.label), `${e0.transport} ${e0.port}`] : [short(e0.label)];
}

async function layout(cur) {
  const g = levelGraph(cur); wireList = g.wires;
  showLabels = labelOverride ?? g.wires.length <= 45;
  const boxes = {};   // key -> { main, small, cls, port, sub }
  g.inPorts.forEach((p, i) => boxes["in:" + p] = { main: title(p), small: `In${i+1}`, cls: "ioport", port: "in" });
  g.outPorts.forEach((p, i) => boxes["out:" + p] = { main: title(p), small: `Out${i+1}`, cls: "ioport", port: "out" });
  for (const c of g.kids) { const n = N[c], sub = !!(n.children && n.children.length);
    boxes[c] = { main: n.title + (sub ? " ▸" : ""), small: n.sub, cls: domOf(c), sub }; }
  // blocks grow with their wire count (like Simulink) so arrowheads get their own slot
  const deg = {}; g.wires.forEach(w => { deg[w.to] = (deg[w.to] || [0, 0]); deg[w.to][0]++; deg[w.from] = (deg[w.from] || [0, 0]); deg[w.from][1]++; });
  const mk = key => { const b = boxes[key], [di, dout] = deg[key] || [0, 0];
    const w = Math.max(tw(b.main, 12, true), b.small ? tw(b.small, 10) : 0) + 28;
    return { id: key, width: Math.ceil(Math.max(w, 96)), height: Math.max(b.small ? 46 : 32, 16 * Math.max(di, dout) + 14),
      layoutOptions: b.port ? { "elk.layered.layering.layerConstraint": b.port === "in" ? "FIRST" : "LAST" } : {} }; };
  const framed = cur !== "root";
  const kids = g.kids.map(mk), ports = Object.keys(boxes).filter(k => boxes[k].port).map(mk);
  const edges = g.wires.map((w, wi) => { const t = wireText(w);
    return { id: "w" + wi, sources: [w.from], targets: [w.to],
      labels: t.length ? [{ text: t.join("\n"), width: Math.ceil(Math.max(...t.map((s, j) => tw(s, j ? 9 : 10)))) + 12, height: 14 * t.length + 5 }] : [] }; });
  const opts = {
    "elk.algorithm": "layered", "elk.direction": "RIGHT", "elk.edgeRouting": "ORTHOGONAL",
    "elk.hierarchyHandling": "INCLUDE_CHILDREN",
    "elk.spacing.nodeNode": "28", "elk.layered.spacing.nodeNodeBetweenLayers": "70",
    "elk.spacing.edgeNode": "18", "elk.spacing.edgeEdge": "12",
    "elk.layered.spacing.edgeNodeBetweenLayers": "22", "elk.layered.spacing.edgeEdgeBetweenLayers": "12",
    "elk.spacing.edgeLabel": "4", "elk.edgeLabels.placement": "CENTER",
    "elk.layered.nodePlacement.strategy": "NETWORK_SIMPLEX",
    "elk.layered.crossingMinimization.thoroughness": "30",
    "elk.layered.mergeEdges": "false", "elk.padding": "[top=16,left=16,bottom=16,right=16]" };
  const graph = { id: "root", layoutOptions: opts, edges,
    children: framed ? [...ports, { id: "frame", layoutOptions: { "elk.padding": "[top=40,left=28,bottom=28,right=28]" }, children: kids }] : kids };
  return { res: await elk.layout(graph), boxes, framed };
}

function svgOf({ res, boxes, framed }) {
  const pal = d => MODEL.domains[d][dark ? "dark" : "light"];
  const abs = {};   // node id -> absolute {x,y,w,h}
  const walk = (n, ox, oy) => (n.children || []).forEach(c => { const x = ox + c.x, y = oy + c.y;
    abs[c.id] = { x, y, w: c.width, h: c.height }; walk(c, x, y); });
  walk(res, 0, 0); abs.root = { x: 0, y: 0 };
  // number ports top-to-bottom, like Simulink
  for (const dir of ["in", "out"]) Object.keys(boxes).filter(k => boxes[k].port === dir).sort((a, b) => abs[a].y - abs[b].y)
    .forEach((k, i) => boxes[k].small = `${dir === "in" ? "In" : "Out"}${i + 1}`);
  const o = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${res.width} ${res.height}">`,
    `<defs><marker id="ah" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0,0 L10,3.5 L0,7 z"/></marker>`,
    `<marker id="ahl" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path class="ahl" d="M0,0 L10,3.5 L0,7 z"/></marker></defs>`];
  if (framed) { const f = abs.frame;
    const ft = `${esc(title(cur))} — inside`;
    o.push(`<g class="frame"><rect class="fr" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="12"/><rect class="fm" x="${f.x + 8}" y="${f.y + 8}" width="${Math.ceil(tw(title(cur) + " — inside", 11, true)) + 12}" height="19" rx="3"/><text x="${f.x + 14}" y="${f.y + 22}">${ft}</text></g>`); }
  // wires first so blocks sit on top of them
  const labels = [];
  res.edges.forEach((e, wi) => {
    const c = abs[e.container || "root"] || abs.root, pts = [];
    for (const s of e.sections || []) { pts.push(s.startPoint, ...(s.bendPoints || []), s.endPoint); }
    const d = pts.map((p, i) => `${i ? "L" : "M"}${(c.x + p.x).toFixed(1)},${(c.y + p.y).toFixed(1)}`).join(" ");
    const isSeq = wireList[wi].edges.every(i => E[i].seq);
    o.push(`<g class="wg" data-wire="${wi}"><path class="hit" d="${d}"/><path class="wire${isSeq ? " seq" : ""}" d="${d}" marker-end="url(#ah)"/></g>`);
    for (const l of e.labels || []) { const lines = l.text.split("\n"), x = c.x + l.x, y = c.y + l.y;
      labels.push(`<g class="edgeLabel" data-wire="${wi}"><rect x="${x}" y="${y}" width="${l.width}" height="${l.height}" rx="3"/>`
        + lines.map((s, j) => `<text x="${x + l.width / 2}" y="${y + 12 + 14 * j}" class="${j ? "lt" : "lm"}">${esc(s)}</text>`).join("") + `</g>`); }
  });
  for (const [key, b] of Object.entries(boxes)) { const a = abs[key]; if (!a) continue;
    const [fill, stroke] = pal(b.cls), cx = a.x + a.w / 2;
    const rx = b.port ? a.h / 2 : b.sub ? 4 : 6;
    const t = b.port ? [[b.small, "ns"], [b.main, "nm"]] : [[b.main, "nm"], ...(b.small ? [[b.small, "ns"]] : [])];
    const y0 = a.y + a.h / 2 - (t.length - 1) * 7.5 + 4;
    o.push(`<g class="node${b.sub ? " sub" : ""}${b.port ? " port" : ""}" data-key="${esc(key)}"><rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="${rx}" style="fill:${fill};stroke:${stroke}"/>`
      + t.map(([s, cl], j) => `<text x="${cx}" y="${y0 + 15 * j}" class="${cl}">${esc(s)}</text>`).join("") + `</g>`);
  }
  o.push(...labels, "</svg>");
  return o.join("");
}

/* ---- render a level ---- */
let cur = "root", renderSeq = 0, hilite = null;
async function render(id) {
  cur = id; const seq = ++renderSeq;
  crumbs();
  let svg;
  try { svg = svgOf(await layout(id)); }
  catch (err) { $("#canvas").innerHTML = `<pre>${esc(err.stack || err)}</pre>`; return; }
  if (seq !== renderSeq) return;
  crumbs();   // showLabels is decided during layout
  $("#canvas").innerHTML = svg;
  zoom = "fit"; applyZoom();
  bind();
  const h = hilite; hilite = null;   // one-shot: back/forward never replays a trace step
  if (h) applyHilite(h); else showNode(id);
}

function bind() {
  const root = $("#canvas svg");
  root.querySelectorAll("g.node").forEach(el => {
    const key = el.dataset.key;
    if (key.startsWith("in:") || key.startsWith("out:")) { el.addEventListener("click", () => { hilite = null; showPort(key); }); return; }
    el.addEventListener("click", () => { hilite = null; if (N[key].children) go(key); else showNode(key); });
  });
  root.querySelector("g.frame")?.addEventListener("click", () => { hilite = null; showNode(cur); });
  root.querySelectorAll("[data-wire]").forEach(el => el.addEventListener("click", () => { hilite = null; showWire(+el.dataset.wire); }));
  // hovering a wire or its label lights up both
  root.querySelectorAll("[data-wire]").forEach(el => {
    const all = () => root.querySelectorAll(`[data-wire="${el.dataset.wire}"]`);
    el.addEventListener("mouseenter", () => all().forEach(x => x.classList.add("hov")));
    el.addEventListener("mouseleave", () => all().forEach(x => x.classList.remove("hov")));
  });
}

/* ---- zoom: fit to canvas width, or natural size × factor ---- */
let zoom = "fit";
function applyZoom() {
  const svg = $("#canvas svg"); if (!svg) return;
  const w = svg.viewBox.baseVal.width, box = $("#canvas").clientWidth - 32;
  // ponytail: fit never shrinks below 0.8 so text stays legible; big levels scroll instead
  const f = zoom === "fit" ? Math.max(0.8, Math.min(1.2, box / w)) : zoom;
  svg.style.width = (w * f) + "px"; svg.style.maxWidth = "none"; svg.removeAttribute("height");
}
function zoomBy(k) { const svg = $("#canvas svg"); if (!svg) return;
  const cur = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width; zoom = Math.max(0.2, Math.min(3, cur * k)); applyZoom(); }

function go(id) { labelOverride = null; if (location.hash.slice(1) !== id) location.hash = id; else render(id); }

function crumbs() {
  const chain = ancestors(cur).reverse();
  $("#crumbs").innerHTML = chain.map((id, i) => i === chain.length - 1
    ? `<b>${esc(title(id))}</b>` : `<a data-go="${id}">${esc(title(id))}</a><span class="sep">›</span>`).join(" ")
    + `<span class="up">${cur !== "root" ? `<button class="small" data-go="${parent[cur]}">▲ Up one level</button> ` : `<span class="hint">Click a ▸ block to open it · click a wire for its signals</span> `}`
    + `<button class="small" id="lbl">${showLabels ? "Hide" : "Show"} signal names</button> <button class="small" data-z="0.8">−</button> <button class="small" data-z="fit">Fit</button> <button class="small" data-z="1.25">+</button></span>`;
  $("#lbl").onclick = () => { labelOverride = !showLabels; render(cur); };
  $("#crumbs").querySelectorAll("[data-z]").forEach(b => b.onclick = () => b.dataset.z === "fit" ? (zoom = "fit", applyZoom()) : zoomBy(+b.dataset.z));
  $("#crumbs").querySelectorAll("[data-go]").forEach(a => a.onclick = () => { hilite = null; go(a.dataset.go); });
}

/* ---- side panel ---- */
function sigHTML(e, dir) {
  if (e.seq) return "";
  const other = dir === "in" ? e.from : e.to;
  const kv = [e.transport, e.port && `port ${e.port}`, e.rate].filter(Boolean).map(esc).join(" · ");
  return `<div class="sig"><b>${esc(e.label)}</b><span class="kv">${dir === "in" ? "from" : dir === "out" ? "to" : ""} ${dir ? esc(title(other)) : esc(title(e.from)) + " → " + esc(title(e.to))}</span>
    ${kv ? `<div class="kv">${kv}</div>` : ""}${e.src ? `<div class="kv">source: <code>${esc(e.src)}</code></div>` : ""}</div>`;
}
function showNode(id) {
  const n = N[id], ins = [], outs = [];
  for (const e of E) {
    const fi = within(e.from, id), ti = within(e.to, id);
    if (ti && !fi) ins.push(e); if (fi && !ti) outs.push(e);
  }
  $("#panel").innerHTML = `<h2>${esc(n.title)}</h2>${n.sub ? `<div class="sub">${esc(n.sub)}</div>` : ""}
    <div>${esc(n.summary || "")}</div>
    ${n.children && id !== cur ? `<p><button class="small" id="open">Open ▸</button></p>` : ""}
    ${n.files ? `<h3>Files</h3>${n.files.map(f => `<span class="chip">${esc(f)}</span>`).join("")}` : ""}
    ${n.gotchas ? `<h3>Gotchas</h3>${n.gotchas.map(g => `<div class="gotcha">${esc(g)}</div>`).join("")}` : ""}
    ${ins.filter(e => !e.seq).length ? `<h3>Inputs (${ins.filter(e => !e.seq).length})</h3>${ins.map(e => sigHTML(e, "in")).join("")}` : ""}
    ${outs.filter(e => !e.seq).length ? `<h3>Outputs (${outs.filter(e => !e.seq).length})</h3>${outs.map(e => sigHTML(e, "out")).join("")}` : ""}`;
  const o = $("#open"); if (o) o.onclick = () => go(id);
}
function showWire(wi) {
  const w = wireList[wi]; if (!w) return;
  const name = k => k === "frame" ? title(cur) + " (whole block)" : k.startsWith("in:") || k.startsWith("out:") ? title(k.split(":")[1]) : title(k);
  const es = w.edges.map(i => E[i]).filter(e => !e.seq);
  $("#panel").innerHTML = `<h2>Wire</h2><div class="sub">${esc(name(w.from))} → ${esc(name(w.to))}</div>
    ${es.length ? `<h3>Signals (${es.length})</h3>${es.map(e => sigHTML(e)).join("")}` : `<p class="hint">Execution order: the left step runs before the right one, every tick.</p>`}`;
}
function showPort(key) {
  const [dir, id] = key.split(":");
  const es = E.filter(e => !e.seq && (dir === "in" ? within(e.from, id) && within(e.to, cur) : within(e.to, id) && within(e.from, cur)));
  $("#panel").innerHTML = `<h2>${dir === "in" ? "Input port" : "Output port"}</h2>
    <div class="sub">${dir === "in" ? "Signals entering" : "Signals leaving"} <b>${esc(title(cur))}</b> ${dir === "in" ? "from" : "to"} <b>${esc(title(id))}</b></div>
    <p><button class="small" id="open">Go to ${esc(title(id))}</button></p>
    ${es.map(e => sigHTML(e)).join("")}`;
  $("#open").onclick = () => { hilite = null; go(parent[id] || "root"); setTimeout(() => showNode(id), 50); };
}

/* ---- highlight (trace) ---- */
function applyHilite(h) {
  const svg = $("#canvas svg"); if (!svg) return;
  if (h.edge) {
    const idx = E.findIndex(e => e.id === h.edge);
    const wi = wireList.findIndex(w => w.edges.includes(idx));
    svg.querySelectorAll(`[data-wire="${wi}"]`).forEach(el => el.classList.contains("wg")
      ? (el.classList.add("hl-edge"), el.querySelector(".wire").setAttribute("marker-end", "url(#ahl)")) : el.classList.add("hl-label"));
    showWire(wi);
  }
  if (h.node) {
    const key = ancestors(h.node).find(a => parent[a] === cur) || h.node;
    svg.querySelectorAll(`g.node[data-key="${key}"]`).forEach(el => el.classList.add("hl-node"));
    showNode(h.node);
  }
  if (!h.text) return;   // plain "jump to block" (repo map): no step box
  const box = $("#panel"), steps = MODEL.traces[h.tr].steps;
  box.insertAdjacentHTML("afterbegin", `<div class="sig" style="border-color:var(--hl)"><b>${esc(MODEL.traces[h.tr].title)} — step ${h.step + 1} of ${steps.length}</b>${esc(h.text)}
    <div style="margin-top:6px">${h.step > 0 ? `<button class="small" id="tprev">◂ Prev</button> ` : ""}${h.step < steps.length - 1 ? `<button class="small" id="tnext">Next ▸</button>` : ""}</div></div>`);
  const p = $("#tprev"), n = $("#tnext");
  if (p) p.onclick = () => runStep(h.tr, h.step - 1); if (n) n.onclick = () => runStep(h.tr, h.step + 1);
}
function navTo(level) { tab("diagram"); if (location.hash.slice(1) === level) render(level); else location.hash = level; }
function runStep(ti, i) {
  const t = MODEL.traces[ti].steps[i]; hilite = { ...t, tr: ti, step: i };
  navTo(t.level);
}
// repo map → show the block inside its parent level, highlighted
function jump(id) { hilite = { node: id }; navTo(parent[id] || "root"); }

/* ---- other views ---- */
function buildTrace() {
  $("#trace").innerHTML = `<h2>Follow a run</h2><p class="hint">Two walk-throughs of the same system: how a run starts, and what happens inside one physics frame. Click a step to jump to that level of the diagram with the relevant block or wire highlighted.</p>`
    + MODEL.traces.map((tr, ti) => `<h3 class="tr-h">${String.fromCharCode(65 + ti)} · ${esc(tr.title)}</h3><p class="hint">${esc(tr.intro)}</p>`
      + tr.steps.map((t, i) => `<div class="trace-step" data-t="${ti}" data-i="${i}"><span class="n">${i + 1}</span>${esc(t.text)} <span class="hint">— ${esc(title(t.level))}</span></div>`).join("")).join("");
  $("#trace").querySelectorAll(".trace-step").forEach(d => d.onclick = () => runStep(+d.dataset.t, +d.dataset.i));
}
function buildRepo() {
  $("#repo").innerHTML = `<h2>Repo map</h2><p class="hint">Where each folder or file lives in the block diagram. Click a block name to jump to it.</p>
    <table><tr><th>Path</th><th>Block</th><th>What it does</th></tr>`
    + MODEL.repo.map(r => `<tr><td><code>${esc(r.path)}</code></td><td><a class="jump" data-id="${r.node}">${esc(title(r.node))}</a></td><td>${esc(r.what)}</td></tr>`).join("") + "</table>";
  $("#repo").querySelectorAll(".jump").forEach(a => a.onclick = () => jump(a.dataset.id));
}
function buildPorts() {
  const rows = E.filter(e => e.port).sort((a, b) => parseInt(a.port) - parseInt(b.port));
  $("#ports").innerHTML = `<h2>Port map</h2><p class="hint">Generated from the diagram's wires — every network port in the system. The 8080 rows double as the GUI's API route list.</p>
    <table><tr><th>Port</th><th>Transport</th><th>From → To</th><th>Signal</th><th>Rate</th><th>Source</th></tr>`
    + rows.map(e => `<tr><td><code>${esc(e.port)}</code></td><td>${esc(e.transport || "")}</td><td>${esc(title(e.from))} → ${esc(title(e.to))}</td><td>${esc(e.label)}</td><td>${esc(e.rate || "")}</td><td>${e.src ? `<code>${esc(e.src)}</code>` : ""}</td></tr>`).join("") + "</table>";
}
function tab(v) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
}

/* ---- boot ---- */
const m = MODEL.meta;
$("#meta").innerHTML = `Simulink-style map of how the KTP-DT repo and simulator work — layout is automatic. v${m.version} · verified against <code>${m.repo}</code> · ${m.updated}. If the code has moved on since, trust the code.`;
$("#legend").innerHTML = Object.values(MODEL.domains).map(d => `<span><i style="background:${d[dark ? "dark" : "light"][0]};border-color:${d[dark ? "dark" : "light"][1]}"></i>${esc(d.name)}</span>`).join("")
  + `<span>▸ thick border = subsystem (click to open)</span><span>dashed arrow = execution order</span><span>In ports left · Out ports right · one arrow per direction</span>`;
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => tab(b.dataset.v));
check(); buildTrace(); buildPorts(); buildRepo();
window.addEventListener("resize", () => { if (zoom === "fit") applyZoom(); });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1) || "root"; render(N[id] && N[id].children ? id : "root"); });
// wait for the mono web font so block widths are measured with it
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { const id = location.hash.slice(1); render(N[id] && N[id].children ? id : "root"); });
</script>
</body>
</html>
